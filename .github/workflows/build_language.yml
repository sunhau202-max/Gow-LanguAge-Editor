name: Build Gow LanguAge Editor
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: build_language.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: GowLanguageEditor
          path: dist/GowLanguageEditor/
